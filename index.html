<!DOCTYPE html>
<html lang="zh-CN">
<head>

    </button>

    <!-- 侧边抽屉导航：默认隐藏，点击 ☰ 展开 -->
    <nav id="sidebar">
      <div class="brand">
        <span class="brand-icon">α</span>
        <span class="brand-name">词网</span>

      </div>
      <div class="side-block">
        <label class="side-label" for="searchInput">
          <svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          搜索单词
        </label>
        <input id="searchInput" type="text" placeholder="输入后回车定位节点" autocomplete="off" spellcheck="false">
      </div>
      <div class="side-block">
        <label class="side-label" for="libraryList">
          <svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19,2H5C2.243,2,0,4.243,0,7v10c0,2.757,2.243,5,5,5h14c2.757,0,5-2.243,5-5V7c0-2.757-2.243-5-5-5ZM2,17V7c0-1.654,1.346-3,3-3H13V20H5c-1.654,0-3-1.346-3-3Zm20,0c0,1.654-1.346,3-3,3h-4V4h4c1.654,0,3,1.346,3,3v10Zm-2-6c0,.553-.448,1-1,1h-1c-.552,0-1-.447-1-1s.448-1,1-1h1c.552,0,1,.447,1,1Zm0,4c0,.553-.448,1-1,1h-1c-.552,0-1-.447-1-1s.448-1,1-1h1c.552,0,1,.447,1,1Zm0-8c0,.553-.448,1-1,1h-1c-.552,0-1-.447-1-1s.448-1,1-1h1c.552,0,1,.447,1,1Z"/></svg>
          词书

        <div id="libraryList" class="library-list" role="listbox"></div>
      </div>
      <label class="field toggle"><input type="checkbox" id="labelToggle"><span>显示单词</span></label>
      <div id="statInfo" class="stat"></div>
    </nav>

    <!-- 打开侧边栏时的半透明遮罩，点击关闭 -->
    <div id="overlay"></div>

    <div id="legend"></div>
    <div id="hint">菜单 左侧切换词库 | 拖拽节点调整布局 | 滚轮缩放 | 拖拽空白平移 | 点击节点高亮邻居 | Esc 取消</div>
    <div id="tooltip" class="hidden"></div>
  </main>

  <script src="data/libraries.js"></script>
  <script src="data/waijiaoshe-8a.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
